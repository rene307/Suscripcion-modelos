<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Administración | Valentina
  </title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>


<body class="dashboard">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <a
      class="brand"
      href="/"
    >
      <strong>
        VALENTINA
      </strong>

      <small>
        ADMINISTRATION
      </small>
    </a>


    <nav class="nav">

      <span id="adminName">
      </span>

      <button
        class="btn btn-outline"
        id="logoutBtn"
        type="button"
      >
        SALIR
      </button>

    </nav>

  </header>


  <!-- =====================================================
       DASHBOARD
  ====================================================== -->

  <div class="dashboard-wrap">


    <!-- ===================================================
         SIDEBAR
    ==================================================== -->

    <aside class="sidebar">

      <h3>
        Panel privado
      </h3>


      <div class="side-nav">

        <button
          class="active"
          data-view="content"
          type="button"
        >
          Contenido
        </button>


        <button
          data-view="users"
          type="button"
        >
          Clientes
        </button>


        <button
          data-view="chat"
          type="button"
        >
          Chat
        </button>

      </div>

    </aside>


    <!-- ===================================================
         CONTENIDO PRINCIPAL
    ==================================================== -->

    <main class="main-panel">


      <!-- =================================================
           CONTENIDO
      ================================================== -->

      <section id="view-content">

        <div class="topline">

          <div>

            <div class="eyebrow">
              ADMIN
            </div>

            <h1 class="page-title">
              Contenido
            </h1>

          </div>

        </div>


        <!-- ===============================================
             ESTADÍSTICAS
        ================================================ -->

        <div class="stats">

          <div class="stat">

            <small>
              CONTENIDO
            </small>

            <strong id="contentCount">
              0
            </strong>

          </div>


          <div class="stat">

            <small>
              CLIENTES
            </small>

            <strong id="userCount">
              0
            </strong>

          </div>


          <div class="stat">

            <small>
              ESTADO
            </small>

            <strong>
              Online
            </strong>

          </div>

        </div>


        <!-- ===============================================
             SUBIR CONTENIDO
        ================================================ -->

        <section class="panel">

          <h3>
            Subir foto o video
          </h3>


          <form id="uploadForm">

            <div class="upload-row">


              <div class="form-group">

                <label>
                  Título
                </label>

                <input
                  class="input"
                  name="titulo"
                  required
                >

              </div>


              <div class="form-group">

                <label>
                  Archivo
                </label>

                <input
                  class="input"
                  type="file"
                  name="archivo"
                  accept="
                    image/jpeg,
                    image/png,
                    image/webp,
                    video/mp4,
                    video/webm
                  "
                  required
                >

              </div>

            </div>


            <div class="form-group">

              <label>
                Descripción
              </label>

              <textarea
                class="input"
                name="descripcion"
              ></textarea>

            </div>


            <button
              class="btn btn-gold"
              type="submit"
            >
              PUBLICAR CONTENIDO
            </button>

          </form>

        </section>


        <!-- ===============================================
             CONTENIDO PUBLICADO
        ================================================ -->

        <div
          class="content-grid"
          id="adminContentGrid"
        >
        </div>

      </section>


      <!-- =================================================
           CLIENTES
      ================================================== -->

      <section
        id="view-users"
        class="hidden"
      >

        <div class="topline">

          <div>

            <div class="eyebrow">
              ADMIN
            </div>

            <h1 class="page-title">
              Clientes
            </h1>

          </div>

        </div>


        <!-- ===============================================
             CREAR CLIENTE
        ================================================ -->

        <section class="panel">

          <h3>
            Crear acceso
          </h3>


          <form id="createUserForm">

            <div class="upload-row">


              <div class="form-group">

                <label>
                  Nombre
                </label>

                <input
                  class="input"
                  name="nombre"
                  required
                >

              </div>


              <div class="form-group">

                <label>
                  Correo
                </label>

                <input
                  class="input"
                  type="email"
                  name="email"
                  required
                >

              </div>


              <div class="form-group">

                <label>
                  Contraseña inicial
                </label>

                <input
                  class="input"
                  type="password"
                  name="password"
                  required
                >

              </div>


              <div class="form-group">

                <label>
                  Acceso hasta
                </label>

                <input
                  class="input"
                  type="datetime-local"
                  name="acceso_hasta"
                >

              </div>

            </div>


            <button
              class="btn btn-gold"
              type="submit"
            >
              CREAR USUARIO
            </button>

          </form>

        </section>


        <!-- ===============================================
             LISTADO DE USUARIOS
        ================================================ -->

        <section class="panel">

          <h3>
            Usuarios
          </h3>


          <div class="table-wrap">

            <table>

              <thead>

                <tr>

                  <th>
                    Nombre
                  </th>

                  <th>
                    Correo
                  </th>

                  <th>
                    Rol
                  </th>

                  <th>
                    Acceso
                  </th>

                  <th>
                    Estado
                  </th>

                  <th>
                  </th>

                </tr>

              </thead>


              <tbody id="usersTable">
              </tbody>

            </table>

          </div>

        </section>

      </section>


      <!-- =================================================
           CHAT
      ================================================== -->

      <section
        id="view-chat"
        class="hidden"
      >

        <div class="topline">

          <div>

            <div class="eyebrow">
              ADMIN
            </div>

            <h1 class="page-title">
              Mensajes
            </h1>

          </div>

        </div>


        <div class="chat-layout">


          <!-- =============================================
               LISTA DE CLIENTES
          ============================================== -->

          <div
            class="chat-users"
            id="chatUsers"
          >
          </div>


          <!-- =============================================
               CHAT PRINCIPAL
          ============================================== -->

          <div class="chat-box">


            <!-- ===========================================
                 CABECERA
            ============================================ -->

            <div class="chat-header">

              <div>

                <h3 id="adminChatTitle">
                  Chat privado
                </h3>

                <small>
                  Conversación con cliente VIP
                </small>

              </div>

            </div>


            <!-- ===========================================
                 MENSAJES
            ============================================ -->

            <div
              class="messages"
              id="adminMessages"
            >

              <p class="chat-empty">
                Selecciona un cliente.
              </p>

            </div>


            <!-- ===========================================
                 EMOJIS
            ============================================ -->

            <div
              class="emoji-picker hidden"
              id="adminEmojiPicker"
            >

              <button type="button">
                😀
              </button>

              <button type="button">
                😂
              </button>

              <button type="button">
                😍
              </button>

              <button type="button">
                🥰
              </button>

              <button type="button">
                😘
              </button>

              <button type="button">
                ❤️
              </button>

              <button type="button">
                🔥
              </button>

              <button type="button">
                👍
              </button>

              <button type="button">
                👏
              </button>

              <button type="button">
                🎉
              </button>

              <button type="button">
                😎
              </button>

              <button type="button">
                😉
              </button>

              <button type="button">
                😊
              </button>

              <button type="button">
                😢
              </button>

              <button type="button">
                😮
              </button>

              <button type="button">
                💋
              </button>

              <button type="button">
                💕
              </button>

              <button type="button">
                ✨
              </button>

            </div>


            <!-- ===========================================
                 ARCHIVO FOTO
            ============================================ -->

            <input
              id="adminImageInput"
              type="file"
              accept="image/jpeg,image/png,image/webp"
              hidden
            >


            <!-- ===========================================
                 ESCRIBIR MENSAJE
            ============================================ -->

            <form
              class="chat-compose"
              id="adminChatForm"
            >

              <div class="chat-tools">


                <!-- EMOJIS -->

                <button
                  class="chat-icon-btn"
                  id="adminEmojiBtn"
                  type="button"
                  title="Emoticones"
                  aria-label="Emoticones"
                >
                  ☺
                </button>


                <!-- FOTO -->

                <button
                  class="chat-icon-btn"
                  id="adminPhotoBtn"
                  type="button"
                  title="Enviar fotografía"
                  aria-label="Enviar fotografía"
                >
                  📷
                </button>


                <!-- AUDIO -->

                <button
                  class="chat-icon-btn"
                  id="adminAudioBtn"
                  type="button"
                  title="Grabar audio"
                  aria-label="Grabar audio"
                >
                  🎤
                </button>

              </div>


              <!-- TEXTO -->

              <input
                class="input chat-message-input"
                id="adminMessageInput"
                type="text"
                placeholder="Escribe un mensaje..."
                autocomplete="off"
              >


              <!-- ENVIAR -->

              <button
                class="btn btn-gold chat-send-btn"
                type="submit"
              >
                ENVIAR
              </button>

            </form>

          </div>

        </div>

      </section>

    </main>

  </div>


  <!-- =====================================================
       SOCKET.IO
  ====================================================== -->

  <script src="/socket.io/socket.io.js"></script>


  <!-- =====================================================
       JAVASCRIPT ADMIN
  ====================================================== -->

  <script src="admin.js"></script>

</body>

</html>
